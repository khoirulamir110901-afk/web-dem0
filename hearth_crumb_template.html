                return data.items.filter(item => item.cat === activeTab);
            }, [activeTab, data.items]);

            return (
                <section id="menu" className="py-24 bg-brand-cream">
                    <div className="container mx-auto px-6 max-w-4xl">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-serif text-brand-coffee mb-4">Our Menu</h2>
                            <p className="text-brand-coffee/60">Available for dine-in and takeaway.</p>
                        </div>

                        {/* Tabs */}
                        <div className="flex overflow-x-auto no-scrollbar gap-8 border-b border-brand-border mb-12">
                            {data.categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setActiveTab(cat)}
                                    className={`pb-4 text-sm font-medium tracking-wider whitespace-nowrap uppercase transition-colors relative ${
                                        activeTab === cat ? 'text-brand-coffee' : 'text-brand-coffee/40 hover:text-brand-coffee/70'
                                    }`}
                                >
                                    {cat}
                                    {activeTab === cat && (
                                        <span className="absolute bottom-0 left-0 w-full h-0.5 bg-brand-terracotta"></span>
                                    )}
                                </button>
                            ))}
                        </div>

                        {/* Menu List */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-16 gap-y-10">
                            {filteredItems.map((item, idx) => (
                                <div key={idx} className="flex flex-col group">
                                    <div className="flex justify-between items-baseline mb-1 gap-4">
                                        <h4 className="text-lg font-serif text-brand-coffee flex items-center gap-2">
                                            {item.name}
                                            {item.bestseller && <span className="text-[10px] uppercase tracking-wider bg-brand-beige px-2 py-0.5 text-brand-brown rounded-sm">Popular</span>}
                                        </h4>
                                        <div className="flex-grow border-b border-dotted border-brand-border/60 mx-2"></div>
                                        <span className="font-medium text-brand-coffee">{item.price}</span>
                                    </div>
                                    <p className="text-sm text-brand-coffee/60">{item.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const ProcessSection = ({ data }) => (
            <section className="py-24 bg-brand-beige/20">
                <div className="container mx-auto px-6 max-w-7xl">
                    <h2 className="text-3xl font-serif text-center mb-16 text-brand-coffee">{data.title}</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-12 text-center">
                        {data.steps.map((step, idx) => (
                            <div key={idx} className="flex flex-col items-center max-w-sm mx-auto">
                                <div className="w-16 h-16 flex items-center justify-center rounded-full bg-brand-cream border border-brand-border mb-6 text-brand-terracotta">
                                    <Icon name={step.icon.toLowerCase()} size={28} strokeWidth={1.5} />
                                </div>
                                <h3 className="text-sm font-semibold tracking-widest uppercase mb-4 text-brand-coffee">{step.title}</h3>
                                <p className="text-brand-coffee/70 text-sm leading-relaxed">{step.desc}</p>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const PromoSection = ({ data }) => {
            if (!data.active) return null;
            return (
                <section className="py-24 bg-brand-cream">
                    <div className="container mx-auto px-6 max-w-5xl">
                        <div className="bg-brand-coffee text-brand-cream flex flex-col md:flex-row items-center rounded-sm overflow-hidden">
                            <div className="w-full md:w-1/2 p-12 lg:p-16 flex flex-col justify-center">
                                <span className="text-xs font-semibold tracking-widest text-brand-cream/50 uppercase mb-4">{data.label}</span>
                                <h2 className="text-3xl lg:text-4xl font-serif mb-4 leading-tight">{data.headline}</h2>
                                <p className="text-brand-cream/70 mb-8">{data.desc}</p>
                                <div className="flex items-center justify-between mb-8 pb-8 border-b border-brand-cream/10">
                                    <span className="text-sm uppercase tracking-widest text-brand-cream/50">Price</span>
                                    <span className="text-2xl font-serif">{data.price}</span>
                                </div>
                                <Button variant="terracotta" className="w-fit self-start">ORDER NOW</Button>
                            </div>
                            <div className="w-full md:w-1/2 h-64 md:h-full">
                                <img src={data.image} alt={data.headline} className="w-full h-full object-cover" />
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const FullWidthExperience = ({ data }) => (
            <section className="relative h-[60vh] min-h-[500px] flex items-center justify-center overflow-hidden">
                <div className="absolute inset-0 z-0">
                    <img src={data.image} alt="Cafe Interior" className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-brand-coffee/40"></div>
                </div>
                <div className="relative z-10 text-center text-brand-cream px-6 max-w-3xl">
                    <h2 className="text-4xl md:text-6xl font-serif mb-6">{data.text}</h2>
                    <p className="text-lg md:text-xl font-light text-brand-cream/90">{data.subtext}</p>
                </div>
            </section>
        );

        const Gallery = ({ data }) => (
            <section id="gallery" className="py-24 bg-brand-cream">
                <div className="container mx-auto px-6 max-w-7xl">
                    <h2 className="text-3xl font-serif text-center mb-16 text-brand-coffee">Moments at Hearth & Crumb</h2>
                    {/* Editorial Grid */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 auto-rows-[200px] md:auto-rows-[300px]">
                        {data.images.map((img, idx) => {
                            // Creating varied sizes for editorial look
                            let spanClass = "col-span-1 row-span-1";
                            if (idx === 0) spanClass = "col-span-2 row-span-2";
                            else if (idx === 3) spanClass = "col-span-2 row-span-1";
                            
                            return (
                                <div key={idx} className={`${spanClass} overflow-hidden rounded-sm group`}>
                                    <img 
                                        src={img} 
                                        alt={`Gallery image ${idx + 1}`} 
                                        className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                                        loading="lazy"
                                    />
                                </div>
                            );
                        })}
                    </div>
                </div>
            </section>
        );

        const BrandStory = ({ data }) => (
            <section className="py-24 bg-brand-beige/30">
                <div className="container mx-auto px-6 max-w-3xl text-center">
                    <div className="flex justify-center mb-8 text-brand-brown">
                        <Icon name="heart" size={32} strokeWidth={1} />
                    </div>
                    <h2 className="text-3xl md:text-4xl font-serif mb-10 text-brand-coffee">{data.headline}</h2>
                    <div className="space-y-6 text-brand-coffee/80 text-lg leading-relaxed font-light">
                        {data.paragraphs.map((p, idx) => <p key={idx}>{p}</p>)}
                    </div>
                    <div className="mt-12 flex justify-center gap-8 text-xs font-semibold tracking-widest text-brand-coffee/60 uppercase">
                        <span>EST. 2024</span>
                        <span className="hidden md:inline">•</span>
                        <span>100% Fresh Daily</span>
                        <span className="hidden md:inline">•</span>
                        <span>Specialty Coffee</span>
                    </div>
                </div>
            </section>
        );

        const Testimonials = ({ data }) => {
            if (!data || data.length === 0) return null;
            return (
                <section className="py-24 bg-brand-cream border-t border-brand-border/50">
                    <div className="container mx-auto px-6 max-w-7xl">
                        <h2 className="text-xs font-semibold tracking-widest text-brand-brown uppercase text-center mb-16">Kind Words From Our Guests</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                            {data.map(review => (
                                <div key={review.id} className="flex flex-col items-center text-center">
                                    <div className="flex gap-1 mb-6 text-brand-terracotta">
                                        {[...Array(review.rating)].map((_, i) => <Icon key={i} name="star" size={16} fill="currentColor" />)}
                                    </div>
                                    <p className="font-serif text-lg text-brand-coffee mb-6 italic leading-relaxed">"{review.quote}"</p>
                                    <span className="text-sm font-medium tracking-wide uppercase text-brand-coffee/60">— {review.name}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const VisitUs = ({ data }) => (
            <section id="visit" className="py-24 bg-brand-cream border-t border-brand-border/30">
                <div className="container mx-auto px-6 max-w-7xl">
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">
                        <div>
                            <h2 className="text-4xl font-serif text-brand-coffee mb-12">Come Say Hello.</h2>
                            
                            <div className="space-y-8">
                                <div className="flex gap-4">
                                    <div className="text-brand-terracotta mt-1"><Icon name="map-pin" /></div>
                                    <div>
                                        <h4 className="font-semibold text-brand-coffee uppercase tracking-wider text-sm mb-2">Location</h4>
                                        <p className="text-brand-coffee/70 max-w-xs">{data.contact.address}</p>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <div className="text-brand-terracotta mt-1"><Icon name="clock" /></div>
                                    <div>
                                        <h4 className="font-semibold text-brand-coffee uppercase tracking-wider text-sm mb-2">Hours</h4>
                                        <p className="text-brand-coffee/70 whitespace-pre-line">{data.contact.hours.replace(' | ', '\n')}</p>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <div className="text-brand-terracotta mt-1"><Icon name="phone" /></div>
                                    <div>
                                        <h4 className="font-semibold text-brand-coffee uppercase tracking-wider text-sm mb-2">Contact</h4>
                                        <p className="text-brand-coffee/70 mb-1">{data.contact.phone}</p>
                                        <p className="text-brand-coffee/70">{data.contact.email}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="mt-12 flex flex-wrap gap-4">
                                <Button>GET DIRECTIONS</Button>
                                <Button variant="secondary" className="flex gap-2">
                                    <Icon name="message-circle" size={18} /> CHAT WITH US
                                </Button>
                            </div>
                        </div>
                        <div className="h-[400px] lg:h-auto bg-brand-border/30 rounded-sm overflow-hidden relative">
                            {/* Static Map Placeholder to avoid API key requirements in template */}
                            <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Map Location" className="w-full h-full object-cover opacity-80 mix-blend-multiply" />
                            <div className="absolute inset-0 flex items-center justify-center">
                                <div className="bg-brand-cream/90 backdrop-blur-sm p-4 rounded-full shadow-lg shadow-brand-coffee/10 animate-bounce">
                                    <Icon name="map-pin" className="text-brand-terracotta" size={32} />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Instagram = ({ data }) => (
            <section className="py-24 bg-brand-cream overflow-hidden">
                <div className="text-center mb-12">
                    <h2 className="text-3xl font-serif text-brand-coffee mb-4">From Our Table To Your Feed</h2>
                    <a href="#" className="inline-flex items-center gap-2 text-brand-terracotta hover:text-brand-coffee transition-colors font-medium">
                        <Icon name="instagram" size={18} />
                        {data.socials.instagram}
                    </a>
                </div>
                {/* Simulated Feed */}
                <div className="flex gap-4 px-4 overflow-x-auto no-scrollbar pb-8">
                    {[
                        "https://images.unsplash.com/photo-1509365465985-25d11c17e812?w=400&q=80",
                        "https://images.unsplash.com/photo-1495474472207-464a8d4ee48b?w=400&q=80",
                        "https://images.unsplash.com/photo-1550428312-70b991307b22?w=400&q=80",
                        "https://images.unsplash.com/photo-1511920170033-f8396924c348?w=400&q=80",
                        "https://images.unsplash.com/photo-1549903072-7e6e0bedb7fb?w=400&q=80"
                    ].map((src, i) => (
                        <div key={i} className="flex-shrink-0 w-64 md:w-72 h-64 md:h-72 bg-brand-border group relative cursor-pointer overflow-hidden rounded-sm">
                            <img src={src} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                            <div className="absolute inset-0 bg-brand-coffee/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                                <Icon name="heart" className="text-white" />
                            </div>
                        </div>
                    ))}
                </div>
            </section>
        );

        const FinalCTA = ({ data }) => (
            <section className="py-32 bg-brand-coffee text-brand-cream text-center px-6">
                <div className="container mx-auto max-w-3xl">
                    <Icon name="coffee" size={40} className="mx-auto mb-8 text-brand-terracotta opacity-80" strokeWidth={1} />
                    <h2 className="text-4xl md:text-5xl font-serif mb-6 leading-tight">COME FOR THE COFFEE.<br/>STAY FOR THE MOMENT.</h2>
                    <p className="text-brand-cream/70 text-lg mb-12">Freshly baked favorites and good coffee are waiting.</p>
                    <div className="flex flex-col sm:flex-row justify-center gap-4">
                        <Button variant="terracotta">ORDER ONLINE</Button>
                        <Button variant="secondary" className="border-brand-cream text-brand-cream hover:bg-brand-cream hover:text-brand-coffee">VIEW MENU</Button>
                    </div>
                </div>
            </section>
        );

        // Main App Component
        const App = () => {
            // In a real scenario, this state would be populated via fetch() from the API using TEMPLATE_CONFIG
            const [content, setContent] = useState(initialContent);

            return (
                <div className="font-sans text-brand-coffee selection:bg-brand-terracotta/30 selection:text-brand-coffee">
                    <Navbar data={content.global} />
                    
                    <main>
                        <Hero data={content.hero} />
                        <BrandIntro data={content.intro} />
                        <ProductHighlights data={content.highlights} />
                        <CoffeeSection data={content.coffeeSection} />
                        <MenuSection data={content.menu} />
                        <ProcessSection data={content.process} />
                        <PromoSection data={content.promo} />
                        <FullWidthExperience data={content.experience} />
                        <Gallery data={content.gallery} />
                        <BrandStory data={content.story} />
                        <Testimonials data={content.testimonials} />
                        <VisitUs data={content.global} />
                        <Instagram data={content.global} />
                        <FinalCTA data={content.global} />
                    </main>

                    <Footer data={content.global} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
