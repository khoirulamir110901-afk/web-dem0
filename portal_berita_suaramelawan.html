                      className="p-2 text-zinc-400 hover:text-white bg-zinc-950 rounded-lg border border-zinc-800 transition"
                    >
                      <X className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Article Content Body */}
                <div className="p-6 sm:p-10 space-y-6 max-h-[80vh] overflow-y-auto">
                  <div className="space-y-3">
                    <div className="text-xs font-mono text-amber-400 flex items-center gap-2">
                      <span>DITERBITKAN: {activeArticle.date}</span>
                      <span>•</span>
                      <span>{activeArticle.views} PEMBACA</span>
                    </div>

                    <h1 className="text-2xl sm:text-3xl md:text-4xl font-extrabold text-white font-serif leading-tight">
                      {activeArticle.title}
                    </h1>

                    <p className="text-base sm:text-lg text-zinc-300 font-medium italic border-l-2 border-amber-400 pl-4 py-1">
                      {activeArticle.excerpt}
                    </p>
                  </div>

                  {/* Author Strip */}
                  <div className="flex items-center justify-between py-3 border-y border-zinc-800 text-xs">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-amber-400 text-zinc-950 font-bold flex items-center justify-center text-sm">
                        {activeArticle.author.slice(0, 2).toUpperCase()}
                      </div>
                      <div>
                        <p className="font-bold text-zinc-100">{activeArticle.author}</p>
                        <p className="text-zinc-400">{activeArticle.authorRole}</p>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => {
                          setArticles((prev) =>
                            prev.map((a) =>
                              a.id === activeArticle.id ? { ...a, likes: a.likes + 1 } : a
                            )
                          );
                          setActiveArticle((prev) => ({ ...prev, likes: prev.likes + 1 }));
                        }}
                        className="flex items-center gap-1.5 bg-zinc-950 hover:bg-zinc-800 text-amber-400 border border-zinc-800 px-3 py-1.5 rounded-lg transition"
                      >
                        <ThumbsUp className="w-3.5 h-3.5" />
                        <span>{activeArticle.likes}</span>
                      </button>
                    </div>
                  </div>

                  {/* Article Hero Image */}
                  <div className="rounded-xl overflow-hidden aspect-video max-h-96">
                    <img
                      src={activeArticle.image}
                      alt={activeArticle.title}
                      className="w-full h-full object-cover"
                    />
                  </div>

                  {/* Text Paragraphs */}
                  <div
                    className={`space-y-4 text-zinc-200 leading-relaxed font-sans ${fontSizeClass}`}
                  >
                    {activeArticle.content.split('\n\n').map((para, i) => (
                      <p key={i}>{para}</p>
                    ))}
                  </div>

                  {/* Disclaimer / Protection Note */}
                  <div className="bg-zinc-950 border border-amber-400/20 rounded-xl p-4 text-xs text-zinc-400 space-y-1">
                    <p className="font-bold text-amber-400">Catatan Independensi:</p>
                    <p>
                      Artikel ini diproduksi di bawah pedoman ketat Kode Etik Jurnalistik SuaraMelawan. Kami menolak segala bentuk kompensasi atau intervensi dari pihak berkepentingan.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {}
          {showWhistleblowerModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-zinc-950/95 backdrop-blur flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-amber-400/50 w-full max-w-lg rounded-2xl p-6 sm:p-8 space-y-5 shadow-2xl relative">
                <button
                  onClick={() => setShowWhistleblowerModal(false)}
                  className="absolute top-5 right-5 text-zinc-400 hover:text-white"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="flex items-center gap-3">
                  <div className="p-3 bg-amber-400 text-zinc-950 rounded-xl">
                    <ShieldAlert className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="text-lg font-black text-white">Bocorkan Fakta (Whistleblower)</h3>
                    <p className="text-xs text-amber-400 font-mono">ENKRIPSI ANTIMATA-MATA</p>
                  </div>
                </div>

                <p className="text-xs text-zinc-300 leading-relaxed">
                  Kirimkan informasi dugaan korupsi, penyalahgunaan wewenang, atau kejahatan korporasi. Alamat IP dan metadata Anda otomatis dihapus oleh server pelindung kami.
                </p>

                <form onSubmit={handleSendTip} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-zinc-300 mb-1">
                      Kategori Pelanggaran
                    </label>
                    <select
                      value={tipCategory}
                      onChange={(e) => setTipCategory(e.target.value)}
                      className="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-200 focus:outline-none focus:border-amber-400"
                    >
                      <option>Korupsi & Penyelewengan APBD/APBN</option>
                      <option>Pelanggaran HAM & Aparat</option>
                      <option>Kerusakan Lingkungan & Tambang Ilegal</option>
                      <option>Eksploitasi Pekerja & Upah</option>
                      <option>Lainnya</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-zinc-300 mb-1">
                      Rincian Informasi / Kronologi
                    </label>
                    <textarea
                      required
                      rows={4}
                      placeholder="Jelaskan instansi terkait, nama tokoh, lokasi kejadian, atau tautan dokumen bukti aman..."
                      value={tipText}
                      onChange={(e) => setTipText(e.target.value)}
                      className="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-amber-400"
                    />
                  </div>

                  <div className="bg-zinc-950 p-3 rounded-lg border border-zinc-800 text-[11px] text-zinc-400 flex items-center gap-2">
                    <Lock className="w-4 h-4 text-amber-400 shrink-0" />
                    <span>Koneksi aman melalui protokol PGP redaksi SuaraMelawan.</span>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-amber-400 hover:bg-amber-300 text-zinc-950 font-black py-3 rounded-lg text-xs uppercase tracking-wider transition"
                  >
                    {tipSuccess ? '✓ Laporan Berhasil Dikirim Secara Anonim' : 'Kirim Informasi Terenkripsi'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {}
          {showBookmarksModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-zinc-950/90 backdrop-blur flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl relative">
                <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Bookmark className="w-4 h-4 text-amber-400" />
                    Artikel Yang Anda Simpan ({bookmarks.length})
                  </h3>
                  <button
                    onClick={() => setShowBookmarksModal(false)}
                    className="text-zinc-400 hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                {bookmarks.length === 0 ? (
                  <p className="text-xs text-zinc-400 text-center py-6">
                    Belum ada artikel yang Anda simpan ke daftar baca nanti.
                  </p>
                ) : (
                  <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                    {articles
                      .filter((a) => bookmarks.includes(a.id))
                      .map((item) => (
                        <div
                          key={item.id}
                          className="p-3 bg-zinc-950 border border-zinc-800 rounded-lg flex items-center justify-between gap-3 group"
                        >
                          <div
                            onClick={() => {
                              setActiveArticle(item);
                              setShowBookmarksModal(false);
                            }}
                            className="cursor-pointer space-y-0.5 flex-1"
                          >
                            <span className="text-[10px] font-bold text-amber-400 uppercase">
                              {item.category}
                            </span>
                            <h4 className="text-xs font-bold text-zinc-200 group-hover:text-amber-300 line-clamp-1">
                              {item.title}
                            </h4>
                          </div>
                          <button
                            onClick={() => toggleBookmark(item.id)}
                            className="text-zinc-500 hover:text-rose-400 p-1"
                            title="Hapus dari simpanan"
                          >
                            <X className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {}
          <footer className="border-t border-zinc-800 bg-zinc-950 text-zinc-400 mt-16 pt-12 pb-8">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                {/* Brand column */}
                <div className="md:col-span-2 space-y-4">
                  <div className="flex items-center gap-2">
                    <span className="bg-amber-400 text-zinc-950 font-black text-xl px-2 py-0.5 rounded-sm">
                      SUARA
                    </span>
                    <span className="text-xl font-black text-white">MELAWAN.</span>
                  </div>
                  <p className="text-xs text-zinc-400 leading-relaxed max-w-sm">
                    Portal jurnalisme warga dan investigasi independen berdedikasi mengabarkan kebenaran, membongkar ketidakadilan, dan mengawal hak-hak publik di seluruh Nusantara.
                  </p>
                  <div className="text-xs font-mono text-zinc-300">
                    Lembaga Berita Terdaftar & Dilindungi UU Pokok Pers No. 40 Tahun 1999.
                  </div>
                </div>

                {/* Rubrik Nav */}
                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider">
                    Kanal Liputan
                  </h4>
                  <ul className="text-xs space-y-1.5">
                    <li><a href="#" className="hover:text-amber-400 transition">Investigasi Khusus</a></li>
                    <li><a href="#" className="hover:text-amber-400 transition">Politik & Oligarki</a></li>
                    <li><a href="#" className="hover:text-amber-400 transition">Hak Asasi Manusia</a></li>
                    <li><a href="#" className="hover:text-amber-400 transition">Krisis Iklim & Lingkungan</a></li>
                    <li><a href="#" className="hover:text-amber-400 transition">Cek Fakta Publik</a></li>
                  </ul>
                </div>

                {/* Redaksi & Etik */}
                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider">
                    Integritas & Kontak
                  </h4>
                  <ul className="text-xs space-y-1.5">
                    <li><a href="#" className="hover:text-amber-400 transition">Pedoman Media Siber</a></li>
                    <li><a href="#" className="hover:text-amber-400 transition">Kunci Publik PGP Redaksi</a></li>
                    <li><a href="#" className="hover:text-amber-400 transition">Hak Jawab & Koreksi</a></li>
                    <li><a href="#" className="hover:text-amber-400 transition">Laporan Keuangan Terbuka</a></li>
                  </ul>
                </div>
              </div>

              <div className="pt-8 border-t border-zinc-900 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-zinc-300 font-mono">
                <p>© 2026 SUARAMELAWAN. Media Independen Indonesia. Hak cipta dilindungi undang-undang.</p>
                <p className="text-amber-400 font-semibold">Suara Untuk Yang Dibungkam.</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
