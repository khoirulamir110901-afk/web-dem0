    const formatRupiah = (num) => {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(num);
    };

    const getUpcomingDates = () => {
      const dates = [];
      const today = new Date();
      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        dates.push({
          full: d.toISOString().split('T')[0],
          dayName: d.toLocaleDateString('id-ID', { weekday: 'short' }),
          dayNumber: d.getDate(),
          monthName: d.toLocaleDateString('id-ID', { month: 'short' }),
          isToday: i === 0
        });
      }
      return dates;
    };

    const TIME_SLOTS = [
      "09:00", "10:30", "12:00", "13:30", "15:00", "16:30", "18:00", "19:30", "21:00"
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home'); // 'home' | 'admin'
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isBookingModalOpen, setIsBookingModalOpen] = useState(false);
      const [selectedServiceDetail, setSelectedServiceDetail] = useState(null);
      const [selectedTherapistDetail, setSelectedTherapistDetail] = useState(null);
      const [faqOpenIndex, setFaqOpenIndex] = useState(0);

      // Quick Bar Filter States
      const [quickService, setQuickService] = useState('jawa');
      const [quickLocation, setQuickLocation] = useState('Studio');
      const [quickDate, setQuickDate] = useState(getUpcomingDates()[0].full);
      const [quickTime, setQuickTime] = useState('14:00');

      // Interactive 7-Step Booking Flow State
      const [bookingStep, setBookingStep] = useState(1);
      const [bookingData, setBookingData] = useState({
        serviceId: 'jawa',
        duration: 90,
        locationType: 'Studio',
        address: '',
        notesAddress: '',
        therapistId: 'maya',
        date: getUpcomingDates()[0].full,
        time: '14:00',
        customerName: '',
        customerPhone: '',
        customerEmail: '',
        customerNotes: '',
        bookingId: '',
        totalPrice: 225000
      });

      const [bookingSuccess, setBookingSuccess] = useState(false);

      // Admin Dashboard State
      const [adminAuth, setAdminAuth] = useState(false);
      const [adminEmail, setAdminEmail] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [adminTab, setAdminTab] = useState('bookings');
      const [allBookings, setAllBookings] = useState([
        {
          id: "WN-9021",
          customerName: "Bpk. Hendra Gunawan",
          customerPhone: "081298765432",
          serviceName: "Pijat Tradisional Jawa",
          duration: 90,
          locationType: "Studio",
          therapistName: "Ibu Maya",
          date: "2026-09-14",
          time: "14:00",
          totalPrice: 225000,
          status: "Confirmed"
        },
        {
          id: "WN-9022",
          customerName: "Ibu Siska Amelia",
          customerPhone: "081344556677",
          serviceName: "Pijat Aromaterapi",
          duration: 60,
          locationType: "Panggilan",
          therapistName: "Mbak Rina",
          date: "2026-09-14",
          time: "16:00",
          totalPrice: 225000,
          status: "Confirmed"
        }
      ]);

      useEffect(() => {
        const s = INITIAL_DATA.services.find(item => item.id === bookingData.serviceId);
        if (!s) return;

        let base = s.basePrice;
        if (bookingData.duration === 90) base = Math.round(base * 1.45);
        if (bookingData.duration === 120) base = Math.round(base * 1.9);

        if (bookingData.locationType === 'Panggilan') {
          base += 35000;
        }

        setBookingData(prev => ({
          ...prev,
          totalPrice: base
        }));
      }, [bookingData.serviceId, bookingData.duration, bookingData.locationType]);

      // Re-initialize Lucide icons after render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const openBookingWithService = (serviceId, initialDuration = 90, location = 'Studio') => {
        setBookingData(prev => ({
          ...prev,
          serviceId: serviceId || 'jawa',
          duration: initialDuration,
          locationType: location
        }));
        setBookingStep(1);
        setBookingSuccess(false);
        setIsBookingModalOpen(true);
      };

      const openBookingWithTherapist = (therapistId) => {
        const therapist = INITIAL_DATA.therapists.find(t => t.id === therapistId);
        setBookingData(prev => ({
          ...prev,
          therapistId: therapistId,
          time: therapist?.nextSlot?.includes(':') ? therapist.nextSlot : '15:00'
        }));
        setBookingStep(3);
        setBookingSuccess(false);
        setIsBookingModalOpen(true);
      };

      const handleQuickCheckSchedule = () => {
        setBookingData(prev => ({
          ...prev,
          serviceId: quickService,
          locationType: quickLocation,
          date: quickDate,
          time: quickTime
        }));
        setBookingStep(3);
        setBookingSuccess(false);
        setIsBookingModalOpen(true);
      };

      const handleConfirmBooking = (e) => {
        if (e) e.preventDefault();
        if (!bookingData.customerName || !bookingData.customerPhone) {
          alert("Silakan lengkapi nama dan nomor WhatsApp Anda terlebih dahulu.");
          return;
        }

        const newId = "WN-" + Math.floor(1000 + Math.random() * 9000);
        const selectedService = INITIAL_DATA.services.find(s => s.id === bookingData.serviceId);
        const selectedTherapist = INITIAL_DATA.therapists.find(t => t.id === bookingData.therapistId);

        const newEntry = {
          id: newId,
          customerName: bookingData.customerName,
          customerPhone: bookingData.customerPhone,
          serviceName: selectedService ? selectedService.name : "Pijat Tradisional",
          duration: bookingData.duration,
          locationType: bookingData.locationType,
          therapistName: selectedTherapist ? selectedTherapist.name : "Terapis Tersedia",
          date: bookingData.date,
          time: bookingData.time,
          totalPrice: bookingData.totalPrice,
          status: "Confirmed"
        };

        setAllBookings([newEntry, ...allBookings]);
        setBookingData(prev => ({ ...prev, bookingId: newId }));
        setBookingSuccess(true);
      };

      const generateWhatsAppUrl = (customMsg = null) => {
        const phone = INITIAL_DATA.brand.phone;
        let text = "";

        if (customMsg) {
          text = encodeURIComponent(customMsg);
        } else {
          const selectedService = INITIAL_DATA.services.find(s => s.id === bookingData.serviceId);
          const selectedTherapist = INITIAL_DATA.therapists.find(t => t.id === bookingData.therapistId);

          text = encodeURIComponent(
            `Halo Warisan Nusantara,\nSaya ingin konfirmasi booking:\n\n` +
            `• Booking ID: ${bookingData.bookingId || "Baru"}\n` +
            `• Nama: ${bookingData.customerName || "Pelanggan"}\n` +
            `• Layanan: ${selectedService ? selectedService.name : "Pijat Tradisional"} (${bookingData.duration} Menit)\n` +
            `• Terapis: ${selectedTherapist ? selectedTherapist.name : "Terapis Tersedia"}\n` +
            `• Lokasi: ${bookingData.locationType} ${bookingData.locationType === 'Panggilan' ? `(${bookingData.address})` : ''}\n` +
            `• Jadwal: ${bookingData.date} pukul ${bookingData.time} WIB\n` +
            `• Total: ${formatRupiah(bookingData.totalPrice)}\n\n` +
            `Mohon konfirmasi ketersediaannya. Terima kasih!`
          );
        }
        return `https://wa.me/${phone}?text=${text}`;
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        setAdminAuth(true);
      };

      return (
        <div className="min-h-screen bg-[#FAF7F2] text-[#2C2621] font-sans antialiased selection:bg-[#C05A3E] selection:text-white flex flex-col justify-between">

                  Pijat Tradisional Indonesia

              </button>

              <nav className="hidden lg:flex items-center space-x-8 text-sm font-medium text-[#4A3F35]">

                <a href="#layanan" className="hover:text-[#C05A3E] transition-colors">Layanan</a>
                <a href="#terapis" className="hover:text-[#C05A3E] transition-colors">Terapis</a>
                <a href="#tentang" className="hover:text-[#C05A3E] transition-colors">Tentang Kami</a>
                <a href="#pengalaman" className="hover:text-[#C05A3E] transition-colors">Keunggulan</a>
                <a href="#ulasan" className="hover:text-[#C05A3E] transition-colors">Ulasan</a>
                <a href="#faq" className="hover:text-[#C05A3E] transition-colors">FAQ</a>
                <a href="#kontak" className="hover:text-[#C05A3E] transition-colors">Kontak</a>

              <div className="hidden sm:flex items-center">
                <button
                  onClick={() => openBookingWithService('jawa', 90)}
                  className="px-6 py-2.5 bg-[#1E392A] hover:bg-[#15271D] text-white text-xs tracking-[0.15em] uppercase font-semibold rounded-md shadow-sm hover:shadow-md transition-all active:scale-[0.98]"

                  BOOKING SEKARANG
                </button>
              </div>

              <div className="flex items-center lg:hidden">
                <button

                  <a href="#beranda" onClick={() => setIsMenuOpen(false)} className="py-1">Beranda</a>
                  <a href="#layanan" onClick={() => setIsMenuOpen(false)} className="py-1">Layanan</a>
                  <a href="#terapis" onClick={() => setIsMenuOpen(false)} className="py-1">Terapis</a>
                  <a href="#tentang" onClick={() => setIsMenuOpen(false)} className="py-1">Tentang Kami</a>
                  <a href="#pengalaman" onClick={() => setIsMenuOpen(false)} className="py-1">Keunggulan</a>
                  <a href="#ulasan" onClick={() => setIsMenuOpen(false)} className="py-1">Ulasan</a>
                  <a href="#faq" onClick={() => setIsMenuOpen(false)} className="py-1">FAQ</a>
                  <a href="#kontak" onClick={() => setIsMenuOpen(false)} className="py-1">Kontak</a>
                </div>
                <button

                    setIsMenuOpen(false);
                    openBookingWithService('jawa', 90);

          {activeTab === 'admin' ? (

              {!adminAuth ? (

                  <div className="text-center mb-6">
                    <span className="text-xs font-semibold tracking-widest text-[#8C6D53] uppercase">Portal Keamanan</span>
                    <h2 className="font-serif text-2xl font-bold text-[#1E392A] mt-1">Masuk Panel Admin</h2>
                    <p className="text-xs text-[#6B5E51] mt-2">Gunakan kredensial pengelola untuk mengelola jadwal & pemesanan.</p>
                  </div>

                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-[#4A3F35] mb-1">Email Administrator</label>
                      <input
                        type="email"
                        value={adminEmail}
                        onChange={(e) => setAdminEmail(e.target.value)}
                        placeholder="admin@nusantara.id"
                        className="w-full text-sm px-3.5 py-2.5 rounded border border-[#D9CBB0] focus:ring-1 focus:ring-[#1E392A] focus:outline-none"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-[#4A3F35] mb-1">Password</label>
                      <input
                        type="password"
                        value={adminPassword}
                        onChange={(e) => setAdminPassword(e.target.value)}
                        placeholder="••••••••"
                        className="w-full text-sm px-3.5 py-2.5 rounded border border-[#D9CBB0] focus:ring-1 focus:ring-[#1E392A] focus:outline-none"
                        required
                      />
                    </div>
                    <button
                      type="submit"
                      className="w-full py-2.5 bg-[#1E392A] hover:bg-[#15271D] text-white text-xs tracking-wider uppercase font-semibold rounded transition"
                    >
                      MASUK DASHBOARD
                    </button>
                  </form>
                </div>
              ) : (
                <div className="space-y-8">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-[#E6DEC8]">
                    <div>
                      <span className="text-xs uppercase tracking-widest text-[#C05A3E] font-bold">Admin Management System</span>
                      <h1 className="font-serif text-3xl font-bold text-[#1E392A]">Pusat Operasional Reservasi</h1>

                        className="flex items-center gap-2 text-xs px-3.5 py-2 rounded border border-[#D9CBB0] text-[#6B5E51] hover:bg-white transition"

                        Keluar Admin
                      </button>
                      <button
                        onClick={() => setActiveTab('home')}
                        className="flex items-center gap-2 text-xs px-4 py-2 rounded bg-[#1E392A] text-white hover:bg-[#15271D] transition"

                        Buka Website Utama

                    </div>
                  </div>

                  />
                </div>
                
                <div className="relative z-10 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
                  <span className="text-xs uppercase tracking-[0.3em] text-[#C69A56] font-bold">
                    KESEIMBANGAN RAGA & PIKIRAN
                  </span>
                  <h2 className="font-serif text-3xl sm:text-5xl font-bold tracking-tight text-white leading-tight">
                    Saatnya Berhenti Sejenak.
                  </h2>
                  <p className="text-sm sm:text-base text-[#D2C8B5] font-light max-w-xl mx-auto leading-relaxed">
                    Pilih layanan pijat Anda dan booking waktu yang paling nyaman hari ini. Terapis terbaik kami siap menyambut Anda.
                  </p>

                  <div className="pt-4 flex flex-wrap items-center justify-center gap-4">
                    <button
                      onClick={() => openBookingWithService('jawa', 90)}
                      className="px-8 py-3.5 border border-white/80 bg-white/10 hover:bg-white hover:text-[#14261C] text-white text-xs tracking-[0.2em] uppercase font-bold rounded transition-all duration-200 active:scale-[0.98] shadow-sm"
                    >
                      BOOKING SEKARANG
                    </button>

                    <a
                      href={generateWhatsAppUrl("Halo Warisan Nusantara, saya ingin bertanya tentang layanan pijat.")}
                      target="_blank"
                      rel="noreferrer"
                      className="px-8 py-3.5 border border-white/80 bg-transparent hover:bg-white hover:text-[#14261C] text-white text-xs tracking-[0.2em] uppercase font-bold rounded transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-2"
                    >
                      <i data-lucide="message-circle" className="w-4 h-4"></i>
                      <span>CHAT WHATSAPP</span>
                    </a>
                  </div>
                </div>
              </section>
            </main>
          )}

          {/* ================= FOOTER ================= */}
          <footer className="bg-[#111C15] text-[#A69B89] text-xs py-14 border-t border-white/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-10">
              <div className="space-y-3">
                <span className="font-serif text-lg tracking-wider font-bold text-white block">WARISAN NUSANTARA</span>
                <p className="text-[11px] text-[#A69B89] leading-relaxed">
                  Warisan pijat tradisional Indonesia yang dikemas secara modern, higienis, dan profesional.
                </p>
              </div>

              <div>
                <h4 className="font-semibold text-white uppercase tracking-wider mb-3">Layanan</h4>
                <ul className="space-y-2 text-[11px]">
                  <li><button onClick={() => openBookingWithService('jawa', 90)} className="hover:text-white transition">Pijat Tradisional Jawa</button></li>
                  <li><button onClick={() => openBookingWithService('urut', 90)} className="hover:text-white transition">Pijat Urut Otot & Kebugaran</button></li>
                  <li><button onClick={() => openBookingWithService('relaksasi', 90)} className="hover:text-white transition">Pijat Relaksasi Nusantara</button></li>
                </ul>
              </div>

              <div>
                <h4 className="font-semibold text-white uppercase tracking-wider mb-3">Jam Operasional</h4>
                <ul className="space-y-1.5 text-[11px]">
                  <li>Senin - Minggu: 09:00 - 22:00 WIB</li>
                  <li className="pt-2 text-white">WhatsApp: {INITIAL_DATA.brand.phoneDisplay}</li>
                  <li>Studio: Senopati, Jakarta Selatan</li>
                </ul>
              </div>

              <div>
                <h4 className="font-semibold text-white uppercase tracking-wider mb-3">Akses Kelola</h4>
                <button
                  onClick={() => { setActiveTab('admin'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                  className="px-3.5 py-2.5 rounded bg-white/5 hover:bg-white/10 border border-white/15 text-xs text-[#D2C8B5] hover:text-white transition flex items-center gap-2 group"
                >
                  <i data-lucide="settings" className="w-3.5 h-3.5 text-[#C69A56] group-hover:rotate-45 transition-transform"></i>
                  <span>Kelola Reservasi (Admin)</span>
                </button>
              </div>
            </div>
          </footer>

          {/* ================= MODAL BOOKING ================= */}
          {isBookingModalOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
              <div className="bg-[#FAF7F2] rounded-2xl w-full max-w-3xl border border-[#E6DEC8] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-[#E6DEC8] flex items-center justify-between bg-white">
                  <div>
                    <span className="text-[10px] uppercase tracking-widest text-[#C05A3E] font-bold">SISTEM RESERVASI ONLINE</span>
                    <h3 className="font-serif font-bold text-lg text-[#1E392A]">
                      {bookingSuccess ? "Konfirmasi Reservasi Berhasil" : `Langkah 0${bookingStep} dari 07`}
                    </h3>
                  </div>
                  <button onClick={() => setIsBookingModalOpen(false)} className="p-2 text-[#8C6D53] hover:text-[#1E392A] rounded-full">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="p-6 overflow-y-auto flex-1">
                  {bookingSuccess ? (
                    <div className="text-center py-6 space-y-6">
                      <div className="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto">
                        <i data-lucide="check-circle-2" className="w-8 h-8"></i>
                      </div>
                      <h4 className="font-serif text-2xl font-bold text-[#1E392A]">Pemesanan Anda Telah Tercatat!</h4>
                      <p className="text-xs text-[#554332]">ID Reservasi: <span className="font-bold">{bookingData.bookingId}</span></p>

                      <div className="flex justify-center gap-3 pt-2">
                        <a
                          href={generateWhatsAppUrl()}
                          target="_blank"
                          rel="noreferrer"
                          className="px-6 py-3 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold tracking-wider uppercase rounded-lg shadow flex items-center gap-2"
                        >
                          <i data-lucide="message-circle" className="w-4 h-4"></i>
                          KONFIRMASI VIA WHATSAPP
                        </a>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-6">
                      {bookingStep === 1 && (
                        <div>
                          <h4 className="font-serif font-bold text-base text-[#1E392A] mb-4">Pilih Jenis Pijat & Durasi</h4>
                          <div className="grid sm:grid-cols-2 gap-3 mb-4">
                            {INITIAL_DATA.services.map((s) => (
                              <div
                                key={s.id}
                                onClick={() => setBookingData(prev => ({ ...prev, serviceId: s.id }))}
                                className={`p-4 rounded-xl border cursor-pointer transition ${bookingData.serviceId === s.id ? 'bg-white border-[#1E392A] ring-1 ring-[#1E392A]' : 'bg-white/60 border-[#E6DEC8]'}`}
                              >
                                <h5 className="font-serif font-bold text-sm text-[#1E392A]">{s.name}</h5>
                                <p className="text-[11px] text-[#6B5E51] mt-1 line-clamp-2">{s.desc}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {bookingStep === 2 && (
                        <div>
                          <h4 className="font-serif font-bold text-base text-[#1E392A] mb-4">Pilih Lokasi Perawatan</h4>
                          <div className="grid sm:grid-cols-2 gap-4">
                            <div
                              onClick={() => setBookingData(prev => ({ ...prev, locationType: 'Studio' }))}
                              className={`p-5 rounded-xl border cursor-pointer ${bookingData.locationType === 'Studio' ? 'bg-white border-[#1E392A] ring-1 ring-[#1E392A]' : 'bg-white/60 border-[#E6DEC8]'}`}
                            >
                              <h5 className="font-serif font-bold text-sm text-[#1E392A]">Studio Warisan Senopati</h5>
                            </div>
                            <div
                              onClick={() => setBookingData(prev => ({ ...prev, locationType: 'Panggilan' }))}
                              className={`p-5 rounded-xl border cursor-pointer ${bookingData.locationType === 'Panggilan' ? 'bg-white border-[#1E392A] ring-1 ring-[#1E392A]' : 'bg-white/60 border-[#E6DEC8]'}`}
                            >
                              <h5 className="font-serif font-bold text-sm text-[#1E392A]">Pijat Panggilan (Home Service)</h5>
                            </div>
                          </div>
                          {bookingData.locationType === 'Panggilan' && (
                            <div className="mt-4">
                              <label className="block text-xs font-semibold text-[#4A3F35] mb-1">Alamat Lengkap</label>
                              <input
                                type="text"
                                value={bookingData.address}
                                onChange={(e) => setBookingData(prev => ({ ...prev, address: e.target.value }))}
                                placeholder="Masukkan alamat lengkap..."
                                className="w-full text-xs px-3.5 py-2.5 rounded border border-[#D9CBB0]"
                              />
                            </div>
                          )}
                        </div>
                      )}

                      {bookingStep === 3 && (
                        <div>
                          <h4 className="font-serif font-bold text-base text-[#1E392A] mb-4">Pilih Terapis Anda</h4>
                          <div className="grid sm:grid-cols-2 gap-3">
                            {INITIAL_DATA.therapists.map((t) => (
                              <div
                                key={t.id}
                                onClick={() => setBookingData(prev => ({ ...prev, therapistId: t.id }))}
                                className={`p-3.5 rounded-xl border cursor-pointer flex items-center gap-3 ${bookingData.therapistId === t.id ? 'bg-white border-[#1E392A] ring-1 ring-[#1E392A]' : 'bg-white/60 border-[#E6DEC8]'}`}
                              >
                                <img src={t.image} alt={t.name} className="w-12 h-12 rounded-full object-cover" />
                                <div>
                                  <h5 className="font-serif font-bold text-xs text-[#1E392A]">{t.name}</h5>
                                  <p className="text-[10px] text-[#8C6D53]">{t.exp}</p>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {bookingStep === 4 && (
                        <div>
                          <h4 className="font-serif font-bold text-base text-[#1E392A] mb-4">Pilih Tanggal Reservasi</h4>
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                            {getUpcomingDates().map((d) => (
                              <button
                                key={d.full}
                                type="button"
                                onClick={() => setBookingData(prev => ({ ...prev, date: d.full }))}
                                className={`p-3 rounded-xl border text-center ${bookingData.date === d.full ? 'bg-[#1E392A] text-white border-[#1E392A]' : 'bg-white border-[#E6DEC8] text-[#4A3F35]'}`}
                              >
                                <div className="text-[10px] uppercase font-bold">{d.dayName}</div>
                                <div className="text-xl font-serif font-bold my-0.5">{d.dayNumber}</div>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {bookingStep === 5 && (
                        <div>
                          <h4 className="font-serif font-bold text-base text-[#1E392A] mb-4">Pilih Waktu / Jam Mulai</h4>
                          <div className="grid grid-cols-3 sm:grid-cols-4 gap-2.5">
                            {TIME_SLOTS.map((slot) => (
                              <button
                                key={slot}
                                type="button"
                                onClick={() => setBookingData(prev => ({ ...prev, time: slot }))}
                                className={`py-2.5 rounded-lg text-xs font-bold ${bookingData.time === slot ? 'bg-[#1E392A] text-white' : 'bg-white border border-[#D9CBB0] text-[#4A3F35]'}`}
                              >
                                {slot} WIB
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {bookingStep === 6 && (
                        <div>
                          <h4 className="font-serif font-bold text-base text-[#1E392A] mb-4">Informasi Kontak & Tamu</h4>
                          <div className="space-y-3">
                            <div>
                              <label className="block text-xs font-semibold text-[#4A3F35] mb-1">Nama Lengkap *</label>
                              <input
                                type="text"
                                value={bookingData.customerName}
                                onChange={(e) => setBookingData(prev => ({ ...prev, customerName: e.target.value }))}
                                placeholder="Contoh: Hendra Gunawan"
                                className="w-full text-xs px-3.5 py-2.5 rounded border border-[#D9CBB0]"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-[#4A3F35] mb-1">Nomor WhatsApp Aktif *</label>
                              <input
                                type="tel"
                                value={bookingData.customerPhone}
                                onChange={(e) => setBookingData(prev => ({ ...prev, customerPhone: e.target.value }))}
                                placeholder="Contoh: 081298765432"
                                className="w-full text-xs px-3.5 py-2.5 rounded border border-[#D9CBB0]"
                              />
                            </div>
                          </div>
                        </div>
                      )}

                      {bookingStep === 7 && (
                        <div>
                          <h4 className="font-serif font-bold text-base text-[#1E392A] mb-4">Ringkasan Pesanan & Konfirmasi</h4>
                          <div className="bg-white p-5 rounded-xl border border-[#E6DEC8] space-y-2.5 text-xs">
                            <div className="flex justify-between">
                              <span className="text-[#8C6D53]">Layanan:</span>
                              <span className="font-bold text-[#1E392A]">{INITIAL_DATA.services.find(s => s.id === bookingData.serviceId)?.name}</span>
                            </div>
                            <div className="flex justify-between">
                              <span className="text-[#8C6D53]">Waktu:</span>
                              <span className="font-medium text-[#1E392A]">{bookingData.date} pukul {bookingData.time} WIB</span>
                            </div>
                            <div className="flex justify-between pt-2 border-t font-bold text-sm text-[#C05A3E]">
                              <span>Total Pembayaran:</span>
                              <span>{formatRupiah(bookingData.totalPrice)}</span>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {!bookingSuccess && (
                  <div className="px-6 py-4 border-t border-[#E6DEC8] bg-white flex items-center justify-between">
                    <span className="font-serif font-bold text-sm text-[#C05A3E]">{formatRupiah(bookingData.totalPrice)}</span>
                    <div className="flex items-center gap-2">
                      {bookingStep > 1 && (
                        <button onClick={() => setBookingStep(bookingStep - 1)} className="px-4 py-2 text-xs font-semibold text-[#4A3F35] border rounded-lg">KEMBALI</button>
                      )}
                      {bookingStep < 7 ? (
                        <button onClick={() => setBookingStep(bookingStep + 1)} className="px-5 py-2 bg-[#1E392A] text-white text-xs font-bold rounded-lg">LANJUTKAN</button>
                      ) : (
                        <button onClick={handleConfirmBooking} className="px-6 py-2 bg-[#C05A3E] text-white text-xs font-bold rounded-lg">KONFIRMASI BOOKING</button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
